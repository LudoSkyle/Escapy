[versions]

# Android
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Kotlin
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.13.0"

# Compose Multiplatform
composeMultiplatform = "1.12.2"
composeMultiplatformMaterial3 = "1.12.0-alpha03" # Built on Compose Multiplatform 1.12, where the latest stable (1.9.0) is built on Compose 1.9

# Navigation 3
navigation3Multiplatform = "1.2.0"
# The one Navigation 3 brings: the back gesture and the back button of the platforms
navigationEventMultiplatform = "1.1.0"

# Lifecycle
lifecycleMultiplatform = "2.11.0" # androidx.lifecycle 2.11.0 on Android

# AndroidX
activityCompose = "1.13.0"
coreSplashscreen = "1.2.0"

# Koin
koin = "4.2.2"

# Firebase Kotlin SDK: 3.x is the only line built with Kotlin 2.4 and firebase-ios-sdk 13 (SwiftPM),
# pinned while in beta (see docs/adr/0003-firebase-en-kotlin-commun-avec-gitlive.md)
gitliveFirebase = "3.0.0-beta1"

# Logs
kermit = "2.2.0"

# Tests
junit = "4.13.2"
robolectric = "4.18.1"
# The androidx.compose.ui under Compose Multiplatform 1.12.2 on Android
androidxComposeUi = "1.12.1"

# Plugins
agp = "9.5.2"
googleServices = "4.6.0"

[libraries]
# Compose Multiplatform
composeMultiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
composeMultiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
composeMultiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
composeMultiplatform-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
composeMultiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
composeMultiplatform-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# Navigation 3
navigation3Multiplatform-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Multiplatform" }
navigationEventMultiplatform-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationEventMultiplatform" }

# Lifecycle
lifecycleMultiplatform-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycleMultiplatform" }
lifecycleMultiplatform-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
lifecycleMultiplatform-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleMultiplatform" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Firebase
gitlive-firebase-app = { module = "dev.gitlive:firebase-app", version.ref = "gitliveFirebase" }
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitliveFirebase" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitliveFirebase" }
gitlive-firebase-functions = { module = "dev.gitlive:firebase-functions", version.ref = "gitliveFirebase" }
gitlive-firebase-storage = { module = "dev.gitlive:firebase-storage", version.ref = "gitliveFirebase" }

# Logs
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Tests
test-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
test-kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
test-junit = { module = "junit:junit", version.ref = "junit" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# The screens drawn in the test itself, with no app to launch
test-composeMultiplatform-ui = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
# The activity runComposeUiTest starts on Android, declared in the manifest of the host tests
test-androidx-compose-ui-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUi" }

# Gradle plugins, put on the build classpath by buildSrc
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
plugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-composeMultiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-googleServices = { module = "com.google.gms:google-services", version.ref = "googleServices" }
