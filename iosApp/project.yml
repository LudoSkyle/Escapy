name: iosApp
options:
  deploymentTarget:
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "20000"
packages:
  # Generated by the Kotlin Gradle plugin (:shared:integrateLinkagePackage): it links the
  # firebase-ios-sdk products the Firebase Kotlin SDK declares as SwiftPM dependencies. Never
  # declare Firebase a second time here: its symbols would be linked twice
  KotlinMultiplatformLinkedPackage:
    path: KotlinMultiplatformLinkedPackage
targets:
  iosApp:
    type: application
    platform: iOS
    # Shared, for the command line and the CI to build it from a fresh clone
    scheme: {}
    configFiles:
      Debug: Configuration/Escapy.xcconfig
      Release: Configuration/Escapy.xcconfig
    sources:
      - iosApp
    dependencies:
      - package: KotlinMultiplatformLinkedPackage
        product: KotlinMultiplatformLinkedPackage
    settings:
      base:
        PRODUCT_NAME: Escapy
        PRODUCT_BUNDLE_IDENTIFIER: fr.skyle.escapy
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # The Gradle build phase reads and writes outside of the Xcode project
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      # From the private submodule, when there: a build without it has no Firebase
      - name: Copy the Firebase file
        basedOnDependencyAnalysis: false
        script: |
          source="$SRCROOT/../private/firebase/GoogleService-Info.plist"
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$source" ]; then
            cp "$source" "$destination"
          else
            rm -f "$destination"
          fi
      # GoogleSignIn needs the reversed iOS client of the Firebase file as a URL scheme of the app:
      # added to the built Info.plist, so that no identifier of the project is in the public repository.
      # The built Info.plist as an input makes Xcode run this phase after writing it, not before
      - name: Add the URL scheme of Google Sign-In
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          source="$SRCROOT/../private/firebase/GoogleService-Info.plist"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          scheme=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$source" 2>/dev/null || true)
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
          if [ -n "$scheme" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $scheme" "$plist"
          fi
